<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forma">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Forma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#060a13; --bg2:#0b1120; --card:#0f1729; --card2:#16213a; --line:#1f2d4a;
  --fg:#eaf0ff; --mute:#8696b8; --acc:#4f8cff; --acc-ink:#031029; --acc-soft:rgba(79,140,255,.16);
  --cy:#46e0ff; --warn:#ffc857; --bad:#ff6b7a; --glow:rgba(79,140,255,.17);
  --f-d:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif; --f-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#edf2fb; --bg2:#e3eaf7; --card:#ffffff; --card2:#f0f4fc; --line:#d8e0f0;
  --fg:#0b1530; --mute:#5a6b8c; --acc:#1d5fe6; --acc-ink:#ffffff; --acc-soft:rgba(29,95,230,.10);
  --cy:#0a8fb0; --warn:#a86b00; --bad:#c23b4b; --glow:rgba(29,95,230,.10); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#edf2fb; --bg2:#e3eaf7; --card:#ffffff; --card2:#f0f4fc; --line:#d8e0f0;
  --fg:#0b1530; --mute:#5a6b8c; --acc:#1d5fe6; --acc-ink:#ffffff; --acc-soft:rgba(29,95,230,.10);
  --cy:#0a8fb0; --warn:#a86b00; --bad:#c23b4b; --glow:rgba(29,95,230,.10); color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--fg)}
h1,h2,h3{font-family:var(--f-d);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px;line-height:1.1}
h2{font-size:24px;line-height:1.12}
.app{max-width:480px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column;
  background:radial-gradient(120% 45% at 50% -8%,var(--glow),transparent 62%),var(--bg)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--mute)} .small{font-size:12px} .cy{color:var(--cy)} .acc{color:var(--acc)} .warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.tight{padding:6px 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.tr{text-align:right}
.hidden{display:none!important}

nav{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px;font-size:11px;color:var(--mute);font-weight:500}
nav button.on{color:var(--acc);background:var(--acc-soft)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-weight:600;font-size:16px;font-family:var(--f-d);background:var(--acc);color:var(--acc-ink);position:relative}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);padding:12px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);padding:12px;font-size:14px}
.btn.sm{padding:10px 14px;font-size:14px;width:auto;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.badge.cy{background:color-mix(in srgb,var(--cy) 16%,transparent);color:var(--cy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;font-size:12px;background:var(--bg2);border:1px solid var(--line);color:var(--mute)}
.seg{display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:13px;color:var(--mute);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.in:focus{border-color:var(--acc);outline:none}
.hr{height:1px;background:var(--line)}
.list .it{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .it:last-child{border:0}
.letter{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-family:var(--f-d);font-weight:700;flex:none}
.note{font-size:12px;color:var(--mute);text-align:center;padding:6px 0}

.hello{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.hero h2{margin:6px 0 10px;position:relative}
.hero .chips,.hero .btn{position:relative}
.hero .chips{margin-bottom:16px}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{width:36px;height:36px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.tip .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ring{position:relative;width:78px;height:78px;margin:0 auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1/1.3;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mute)}
.day b{font-family:var(--f-d);font-size:13px;height:16px;line-height:16px}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day.plan{border-style:dashed;border-color:var(--mute)}
.day.done{background:var(--acc-soft);border-color:transparent;color:var(--acc)}.day.done i{background:var(--acc)}
.day.today{border:1px solid var(--acc);color:var(--fg)}

.wo{position:fixed;inset:0;z-index:20;background:var(--bg);display:none}
.wo.open{display:block}
.wo-in{max-width:480px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 38% at 50% 0,var(--glow),transparent 70%),var(--bg)}
.wo-top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px}
.timer{font-size:20px;font-weight:600}
.segs{display:flex;gap:4px;margin-bottom:16px}
.segs i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.segs i.d{background:var(--acc)}.segs i.s{background:var(--mute);opacity:.5}.segs i.c{background:var(--fg)}
.wo-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0;padding-bottom:4px}
.setdots{display:flex;gap:6px;flex-wrap:wrap}
.sd{flex:1 1 0;min-width:74px;padding:9px 4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);text-align:center;font-size:12px;color:var(--mute)}
.sd.d{background:var(--acc-soft);border-color:transparent;color:var(--acc);font-weight:600}
.sd.c{border-color:var(--acc);color:var(--fg)}
.prev{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.prev b{color:var(--cy);font-weight:600}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inputs.one{grid-template-columns:1fr}
.inp{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 10px;text-align:center}
.inp input{width:100%;background:none;border:0;text-align:center;font-family:var(--f-d);font-size:56px;font-weight:600;line-height:1;padding:0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;outline:none}
.inp .unit{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.steps{display:flex;gap:8px;margin-top:12px}
.step{flex:1;height:52px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:24px;font-family:var(--f-d)}
.step:active{background:var(--acc-soft);color:var(--acc)}
details.how{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details.how summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--mute);list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how p{margin:8px 0 0;font-size:13px;color:var(--mute)}
.cta{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.navrow{display:flex;gap:8px}.navrow .btn{flex:1;min-width:0;padding:12px 4px;font-size:13px;white-space:nowrap}

.rest{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:24px 16px}
.rest.open{display:flex}
.bigring{position:relative;width:240px;height:240px;max-width:68vw;max-height:68vw}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:600}
.rest .next{text-align:center;max-width:300px}
.rest .row{width:100%;max-width:320px}

.sbg{position:fixed;inset:0;z-index:50;background:rgba(2,6,16,.6);display:none;align-items:flex-end;justify-content:center}
.sbg.open{display:flex}
.sheet{width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 2px;flex:none}
@media (prefers-reduced-motion:no-preference){
  .sbg.open .sheet{animation:up .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .scroll>*{animation:in .35s both}.scroll>*:nth-child(2){animation-delay:.04s}.scroll>*:nth-child(3){animation-delay:.08s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  circle.prog{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
.toast.show{opacity:1}

.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum-grid .card{padding:12px 6px}.sum-grid .num{font-size:24px;font-weight:600}
.pr{display:flex;align-items:center;gap:10px}
.hrow{display:grid;grid-template-columns:64px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.hbar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:6px;background:var(--acc)}.hbar i.low{background:var(--warn)}
svg text{font-family:var(--f-b);fill:var(--mute);font-size:10px}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:10px;color:var(--mute);text-align:center;text-transform:uppercase;padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--mute)}
.cal .d.off{opacity:0;border:0}
.cal .d.done{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.cal .d.plan{border-style:dashed;border-color:var(--mute)}
.cal .d.today{box-shadow:0 0 0 2px var(--fg)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos button{aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative;background:var(--bg2)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos span{position:absolute;left:0;right:0;bottom:0;font-size:10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:10px 4px 3px;text-align:center}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.exrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border:0}
.mini{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;flex:none}
.mini[disabled]{opacity:.3}
.mini svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app"><main class="scroll" id="view"></main><nav id="nav"></nav></div>
<div class="wo" id="wo"><div class="wo-in" id="woin"></div></div>
<div class="rest" id="rest"></div>
<div class="sbg" id="sbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept=".json,application/json" class="hidden">
<input type="file" id="filePhoto" accept="image/*" class="hidden">

<script>
'use strict';
// ====================== data ======================
const KEY='forma_db_v1', PKEY='forma_photos_v1', OLD='bodyos_db_v1';
const GROUPS=['Грудь','Спина','Плечи','Руки','Ноги','Корпус'];
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

const DEF_EX=[
 {id:'floor_press',name:'Жим гантелей лёжа на полу',muscle:'Грудь · трицепс',sets:3,reps:12,rest:90,dc:2,measure:'reps',step:2,desc:'Лёжа на полу, согните ноги. Гантели на уровне груди, ладони вперёд. Выжмите вверх, не отрывая поясницу от пола, медленно опустите.'},
 {id:'one_arm_row',name:'Тяга гантели одной рукой',muscle:'Спина · бицепс',sets:3,reps:12,rest:90,dc:1,measure:'reps_each',step:2,desc:'Наклонитесь, упор рукой на колено. Тяните гантель к поясу, локоть вдоль тела. Повторы считаются на каждую руку.'},
 {id:'shoulder_press',name:'Жим гантелей сидя',muscle:'Плечи',sets:3,reps:10,rest:90,dc:2,measure:'reps',step:1,desc:'Сидя, спина прямая (можно у стены). Гантели у плеч, выжмите вверх до полного выпрямления, не прогибаясь в пояснице.'},
 {id:'lateral_raise',name:'Разведение гантелей в стороны',muscle:'Плечи',sets:2,reps:12,rest:60,dc:2,measure:'reps',step:1,desc:'Встаньте прямо, слегка согните локти. Разведите гантели в стороны до уровня плеч, медленно опустите.'},
 {id:'bicep_curl',name:'Сгибание рук на бицепс',muscle:'Бицепс',sets:2,reps:12,rest:60,dc:2,measure:'reps',step:1,desc:'Локти прижаты к корпусу. Сгибайте руки, разворачивая кисти вверх, в верхней точке напрягите мышцу, опускайте медленно.'},
 {id:'overhead_ext',name:'Разгибание руки из-за головы',muscle:'Трицепс',sets:2,reps:12,rest:60,dc:1,measure:'reps_each',step:1,desc:'Две руки на диске одной гантели над головой. Сгибайте локти, опуская гантель за голову, разгибайте.'},
 {id:'goblet_squat',name:'Приседания с гантелью у груди',muscle:'Ноги · ягодицы',sets:3,reps:15,rest:90,dc:1,measure:'reps',step:2,desc:'Гантель вертикально у груди, локти вниз. Приседайте до параллели бедер с полом, пятки на полу, колени в стороны.'},

function weekStart(d){d=new Date(d);const k=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-k);return d}
function groupOf(m){const s=String(m||'').split('·')[0].trim().toLowerCase();
  if(/груд/.test(s))return'Грудь'; if(/плеч/.test(s))return'Плечи'; if(/бицеп|трицеп|предплеч|рук/.test(s))return'Руки';
  if(/спин/.test(s))return'Спина'; if(/ног|ягод|икр|задн|бедр/.test(s))return'Ноги'; return'Корпус'}
const done=()=>DB.sessions.filter(s=>s.status==='done').sort((a,b)=>a.startTime<b.startTime?-1:1);
function vol(s){let t=0;s.exercises.forEach(x=>{const e=ex(x.exerciseId)||{};x.sets.forEach(st=>{t+=(st.weight||0)*(st.dc===2?2:1)*(st.reps||0)*(e.measure==='reps_each'?2:1)})});return t}
function setsOf(s){return s.exercises.reduce((a,x)=>a+x.sets.length,0)}
function dur(s){return Math.max(0,Math.round(((new Date(s.endTime||s.startTime))-new Date(s.startTime)-(s.pausedMs||0))/1000))}
function e1rm(st,e){if(e.measure==='time')return st.seconds||0; if(!(st.weight>0))return st.reps||0; return st.weight*(1+(st.reps||0)/30)}
function unitOf(e){return e.measure==='time'?'сек':(e.dc>0?'кг':'повт')}
function fmtSet(st,e){if(e.measure==='time')return(st.seconds||0)+' сек'; if(st.weight>0)return r1(st.weight)+' кг × '+st.reps; return st.reps+' повт'}
function histFor(id,n=1){const o=[];done().slice().reverse().forEach(s=>{const x=s.exercises.find(x=>x.exerciseId===id&&!x.skipped&&x.sets.length);if(x)o.push({s,x})});return o.slice(0,n)}

// autoprogression
function suggest(id){
  const e=ex(id),h=histFor(id,1)[0];
  if(!h)return{w:e.dc>0?8:0,r:e.reps,state:'first',last:''};
  const sets=h.x.sets;
  if(e.measure==='time'){
    const best=Math.max(...sets.map(s=>s.seconds||0)),ok=sets.length>=e.sets&&sets.every(s=>(s.seconds||0)>=e.reps);
    return{w:0,r:ok?best+e.step:Math.max(best,e.reps),state:ok?'up':'hold',last:best+' сек',upText:'+'+e.step+' сек'};
  }
  if(!(e.dc>0)){
    const best=Math.max(...sets.map(s=>s.reps||0)),ok=sets.length>=e.sets&&sets.every(s=>s.reps>=e.reps);
    return{w:0,r:ok?best+1:e.reps,state:ok?'up':'hold',last:best+' повт',upText:'+1 повтор'};
  }
  const wmax=Math.max(...sets.map(s=>s.weight||0)),top=sets.filter(s=>s.weight===wmax);
  const ok=top.length>=e.sets&&top.every(s=>s.reps>=e.reps);
  return{w:ok?r1(wmax+e.step):wmax,r:e.reps,state:ok?'up':'hold',last:r1(wmax)+' кг × '+Math.max(...top.map(s=>s.reps)),upText:'+'+e.step+' кг'};
}
function estMin(w){return Math.round(w.exerciseIds.reduce((a,id)=>{const e=ex(id);return a+e.sets*(45+e.rest)},0)/60)}

function ring(p,size=78,sw=8,col='var(--acc)'){const r=(size-sw)/2,c=2*Math.PI*r;p=Math.max(0,Math.min(1,p));
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle class="prog" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
let gid=0;
function chart(pts,unit){
  if(pts.length<2)return`<div class="muted" style="padding:28px 0;text-align:center;font-size:13px">Нужно хотя бы две записи, чтобы построить график.</div>`;
  const W=320,H=150,L=30,R=10,T=12,B=22;let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
  if(mn===mx){mn-=1;mx+=1}
  const st=niceStep((mx-mn)/3),lo=Math.floor(mn/st)*st,hi=Math.ceil(mx/st)*st;
  const X=i=>L+i*(W-L-R)/(pts.length-1),Y=v=>H-B-(v-lo)/(hi-lo)*(H-B-T);
  const tk=[];for(let v=lo;v<=hi+1e-9;v+=st)tk.push(v);
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const id='g'+(++gid),last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible" role="img" aria-label="график">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".32"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
   ${tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${r1(v)}</text>`).join('')}
   <path d="${path} L${X(pts.length-1)} ${H-B} L${L} ${H-B}Z" fill="url(#${id})"/>
   <path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.length<=24?pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="2.5" fill="var(--acc)"/>`).join(''):''}
   <circle cx="${X(pts.length-1)}" cy="${Y(last.v)}" r="5" fill="var(--acc)" stroke="var(--bg)" stroke-width="2"/>
   <text x="${L}" y="${H-5}">${esc(pts[0].l)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${esc(last.l)}</text></svg>`;
}

// ---------- Today ----------
function weekStats(){
  const S=done(),ws=weekStart(new Date()),pw=new Date(ws);pw.setDate(pw.getDate()-7);
  const inW=S.filter(s=>new Date(s.startTime)>=ws),inP=S.filter(s=>new Date(s.startTime)>=pw&&new Date(s.startTime)<ws);
  const goal=DB.user.weeklyGoal||DB.workouts.length||3;
  let streak=0,cur=new Date(ws);
  const cnt=d=>{const e=new Date(d);e.setDate(e.getDate()+7);return S.filter(s=>{const t=new Date(s.startTime);return t>=d&&t<e}).length};
  if(cnt(cur)>=goal)streak++;
  for(let i=0;i<260;i++){cur=new Date(cur);cur.setDate(cur.getDate()-7);if(cnt(cur)>=goal)streak++;else break}
  return{n:inW.length,goal,vol:inW.reduce((a,s)=>a+vol(s),0),pvol:inP.reduce((a,s)=>a+vol(s),0),streak,sess:inW};
}
function nextWorkout(){
  const t=new Date().getDay(),ws=DB.workouts.filter(w=>w.day!=null&&w.day!==''&&w.day>=0);
  if(!ws.length)return DB.workouts[0]||null;
  return ws.map(w=>({w,d:(w.day-t+7)%7})).sort((a,b)=>a.d-b.d)[0];
}

  const st=weekStats(),today=dk(now),doneToday=done().filter(s=>dk(s.startTime)===today);

  }else{

      hero=`<div class="hero"><div class="eyebrow">${label}</div><h2>${esc(w.name)}</h2>

    else if(!done().length)tip=`<div class="card tip"><div class="ic">${ic('info')}</div><div><b>Первая тренировка.</b><div class="muted" style="font-size:13px;margin-top:2px">Подберите рабочий вес. Дальше Forma будет сама подсказывать, когда прибавлять.</div></div></div>`;
  }
  const imp=(()=>{try{return !localStorage.getItem('forma_imp_dismiss')&&localStorage.getItem(OLD)&&!done().length}catch(e){return false}})();
  const impCard=imp?`<div class="card stack"><div class="row"><div class="tip" style="flex:1"><div class="ic">${ic('info')}</div><div><b>Найдены данные BODY OS</b><div class="muted" style="font-size:13px">Перенести историю, замеры и программу сюда?</div></div></div></div><div class="row"><button class="btn ghost" data-a="impDismiss">Не нужно</button><button class="btn" style="padding:12px;font-size:14px" data-a="impOld">Перенести</button></div></div>`:'';
  // week
  const ws=weekStart(now),days=[];
  for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);const k=dk(d),jd=d.getDay(),dn=done().some(s=>dk(s.startTime)===k),pl=DB.workouts.find(w=>w.day===jd);
    days.push(`<div class="day ${dn?'done':pl?'plan':''} ${k===today?'today':''}">${DOW[jd]}<b>${dn?'✓':pl?esc(pl.name.charAt(0)):''}</b><i></i></div>`)}
  const vr=st.pvol?st.vol/st.pvol:(st.vol?1:0);
  return `<div class="hello"><div><div class="eyebrow">${DOW[now.getDay()]}, ${fmtD(now)}</div><h1>${greet}</h1></div>
    <div class="row" style="gap:6px;color:var(--cy);padding-top:6px" title="Недель подряд с выполненным планом">${ic('flame')}<span class="num" style="font-size:18px;font-weight:600">${st.streak}</span></div></div>

    <div class="rings">
     <div><div class="ring">${ring(st.n/st.goal)}<div class="v num">${st.n}/${st.goal}</div></div><div class="muted small">Тренировки</div></div>
     <div><div class="ring">${ring(vr,78,8,'var(--cy)')}<div class="v num">${r1(st.vol/1000)}</div></div><div class="muted small">Объём, т</div></div>
     <div><div class="ring">${ring(st.streak/8,78,8,'var(--fg)')}<div class="v num">${st.streak}</div></div><div class="muted small">Недель подряд</div></div>
    </div></div>
  <div class="card"><div class="week">${days.join('')}</div></div></div>`;
}

let wake=null,tickInt=null,restInt=null,AC=null;
async function keepAwake(){try{if('wakeLock' in navigator){wake=await navigator.wakeLock.request('screen')}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&DB.active)keepAwake()});
function beep(){if(!DB.user.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();const t=AC.currentTime;[0,.28,.56].forEach((o,i)=>{const os=AC.createOscillator(),g=AC.createGain();os.frequency.value=i===2?1175:880;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.22);os.connect(g);g.connect(AC.destination);os.start(t+o);os.stop(t+o+.24)})}catch(e){}}
function elapsed(A){return Math.floor((Date.now()-new Date(A.startTime)-(A.pausedMs||0)-(A.pauseAt?Date.now()-A.pauseAt:0))/1000)}
function startWo(wid){
  const w=DB.workouts.find(x=>x.id===wid);if(!w||!w.exerciseIds.length){toast('В тренировке нет упражнений');return}
  closeSheet();
  DB.active={id:uid(),workoutId:w.id,workoutName:w.name,startTime:new Date().toISOString(),status:'active',pausedMs:0,pauseAt:null,exIndex:0,restEnd:null,
    exercises:w.exerciseIds.map(id=>({exerciseId:id,sets:[],skipped:false,planned:ex(id).sets}))};
  setCur(0);save();try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}
  openWo();vib(15);
}
function setCur(i){
  const A=DB.active,st=A.exercises[i],e=ex(st.exerciseId);
  if(st.sets.length){const l=st.sets[st.sets.length-1];A.cur={w:l.weight||0,r:e.measure==='time'?l.seconds:l.reps}}
  else{const s=suggest(st.exerciseId);A.cur={w:s.w,r:s.r}}
}
function openWo(){$('#wo').classList.add('open');keepAwake();clearInterval(tickInt);drawWo();
  tickInt=setInterval(()=>{const A=DB.active;const t=$('#tm');if(t&&A)t.textContent=fmt(elapsed(A))},500);
  if(DB.active&&DB.active.restEnd&&DB.active.restEnd>Date.now())showRest()}
function drawWo(){
  const A=DB.active;if(!A)return;const st=A.exercises[A.exIndex],e=ex(st.exerciseId),n=st.sets.length,all=n>=st.planned;
  const sg=suggest(st.exerciseId),paused=!!A.pauseAt,last=A.exIndex===A.exercises.length-1,t=e.measure==='time';
  const unitW=e.dc===1?'кг · одна гантель':'кг · каждая гантель',unitR=t?'секунд':e.measure==='reps_each'?'повторов на сторону':'повторов';
  const hint=sg.state==='first'?'Прошлого раза нет. Подберите вес.':`Прошлый раз <b style="color:var(--fg)">${esc(sg.last)}</b>`;
  const right=sg.state==='up'?`Попробуйте <b>${esc(t?sg.r+' сек':e.dc>0?sg.w+' кг':sg.r+' повт')}</b>`:sg.state==='hold'?'Закрепите результат':'';
  $('#woin').innerHTML=`
  <div class="wo-top"><button class="iconbtn" data-a="quit" aria-label="Выйти">${ic('x','')}</button><div class="timer num" id="tm">${fmt(elapsed(A))}</div><button class="iconbtn" data-a="pause" aria-label="Пауза">${ic(paused?'play':'pause','')}</button></div>
  <div class="segs">${A.exercises.map((x,i)=>`<i class="${x.skipped?'s':x.sets.length>=x.planned?'d':i===A.exIndex?'c':''}"></i>`).join('')}</div>
  <div class="wo-body">

    <div class="setdots">${Array.from({length:Math.max(st.planned,n)},(_,i)=>i<n?`<button class="sd d" data-a="setEdit" data-i="${i}">${esc(t?st.sets[i].seconds+' с':st.sets[i].weight>0?r1(st.sets[i].weight)+'×'+st.sets[i].reps:st.sets[i].reps+' повт')}</button>`:`<div class="sd ${i===n?'c':''}">Подход ${i+1}</div>`).join('')}</div>
    <div class="prev"><span>${hint}</span><span class="cy">${right}</span></div>

    <div class="inputs ${e.dc>0?'':'one'}">

      <div class="inp"><input id="ir" type="number" inputmode="numeric" value="${A.cur.r}" data-in="cr" aria-label="${unitR}"><div class="unit">${unitR}</div><div class="steps"><button class="step" data-a="stp" data-k="r" data-d="-${t?5:1}">−</button><button class="step" data-a="stp" data-k="r" data-d="${t?5:1}">+</button></div></div>
    </div>`}
    <details class="how"><summary>Как делать</summary><p>${esc(e.desc||'')}</p></details>
  </div>
  <div class="cta">
    ${paused?`<button class="btn" data-a="pause">Продолжить</button>`:all?`<button class="btn" data-a="nextEx">${last?'Завершить тренировку':'Следующее упражнение'}</button>`:`<button class="btn" data-a="doneSet">Подход ${n+1} выполнен</button>`}
    <div class="navrow"><button class="btn ghost" data-a="prevEx" ${A.exIndex===0?'disabled':''}>← Назад</button><button class="btn ghost" data-a="addSet">+ Подход</button>${all&&!last?'':`<button class="btn ghost" data-a="skip">Пропустить</button>`}<button class="btn ghost" data-a="swap">Заменить</button></div>
  </div>`;
}
function goEx(i){const A=DB.active;A.exIndex=i;setCur(i);save();drawWo()}
function doneSet(){
  const A=DB.active,st=A.exercises[A.exIndex],e=ex(st.exerciseId),c=A.cur;
  if(!(c.r>0)){toast('Укажите повторы');return}
  st.sets.push({weight:e.dc>0?(+c.w||0):0,reps:e.measure==='time'?0:+c.r,seconds:e.measure==='time'?+c.r:0,dc:e.dc});st.skipped=false;
  vib([20,40,20]);save();
  if(st.sets.length<st.planned){A.restEnd=Date.now()+e.rest*1000;A.restTotal=e.rest;save();drawWo();showRest()}
  else{drawWo()}
}
function showRest(){
  const A=DB.active;if(!A||!A.restEnd)return;const el=$('#rest');el.classList.add('open');
  const st=A.exercises[A.exIndex],e=ex(st.exerciseId),n=st.sets.length;
  const paint=()=>{const left=Math.max(0,Math.ceil((A.restEnd-Date.now())/1000)),tot=Math.max(A.restTotal||left,left);
    el.innerHTML=`<div class="eyebrow">Отдых</div><div class="bigring">${ring(left/tot,240,12)}<div class="t num" id="rt">${fmt(left)}</div></div>
    <div class="next"><div class="muted small">Дальше</div><div style="font-weight:600;margin-top:2px">${esc(e.name)}: подход ${n+1}</div><div class="muted small" style="margin-top:4px">Вес и повторы уже подставлены</div></div>
    <div class="row"><button class="btn sec" data-a="rest15" style="padding:14px">+15 сек</button><button class="btn" data-a="restSkip" style="padding:14px">Продолжить</button></div>`};
  paint();clearInterval(restInt);
  restInt=setInterval(()=>{const left=Math.ceil((A.restEnd-Date.now())/1000);const t=$('#rt');if(t)t.textContent=fmt(Math.max(0,left));
    const c=el.querySelector('circle.prog');if(c){const tot=Math.max(A.restTotal||left,left),cc=2*Math.PI*114;c.style.transition='none';c.setAttribute('stroke-dashoffset',cc*(1-Math.max(0,left)/tot))}
    if(left<=0){vib([200,80,200]);beep();endRest()}},250);
}
function endRest(){clearInterval(restInt);const A=DB.active;if(A){A.restEnd=null;save()}$('#rest').classList.remove('open');drawWo()}
function swapSheet(){
  const A=DB.active,st=A.exercises[A.exIndex],g=groupOf(ex(st.exerciseId).muscle);
  const inW=A.exercises.map(x=>x.exerciseId);
  const all=Object.values(DB.exercises).filter(e=>!inW.includes(e.id)).sort((a,b)=>(groupOf(b.muscle)===g)-(groupOf(a.muscle)===g));
  sheet(`<div class="row between"><h3>Заменить упражнение</h3><button class="iconbtn" data-a="close" aria-label="Закрыть">${ic('x','')}</button></div>
  <div class="muted small">Замена действует только в этой тренировке.</div>
  ${all.map(e=>`<button class="exrow" style="width:100%;text-align:left" data-a="doSwap" data-e="${e.id}"><div class="grow"><div style="font-weight:600">${esc(e.name)}</div><div class="muted small">${esc(e.muscle)}</div></div>${groupOf(e.muscle)===g?'<span class="badge">та же группа</span>':''}</button>`).join('')}`);
}
function finishWo(aborted){
  const A=DB.active;if(!A)return;closeSheet();clearInterval(tickInt);clearInterval(restInt);$('#rest').classList.remove('open');
  try{wake&&wake.release()}catch(e){}
  const any=A.exercises.some(x=>x.sets.length);
  if(!any){DB.active=null;save();$('#wo').classList.remove('open');render();toast('Тренировка отменена');return}
  A.endTime=new Date().toISOString();A.status='done';A.restEnd=null;
  const prev=done();const prs=[];
  A.exercises.forEach(x=>{if(!x.sets.length||x.skipped)return;const e=ex(x.exerciseId);const old=[];prev.forEach(s=>s.exercises.forEach(y=>{if(y.exerciseId===x.exerciseId&&!y.skipped)y.sets.forEach(st=>old.push(st))}));if(!old.length)return;
    const m=st=>e.measure==='time'?st.seconds:e.dc>0?st.weight:st.reps,nb=Math.max(...x.sets.map(m)),ob=Math.max(...old.map(m));
    if(nb>ob)prs.push({name:e.name,val:e.measure==='time'?nb+' сек':e.dc>0?r1(nb)+' кг':nb+' повт',was:e.measure==='time'?ob+' сек':e.dc>0?r1(ob)+' кг':ob+' повт'})});
  const pw=prev.filter(s=>s.workoutId===A.workoutId).pop();
  A.prs=prs;A.cmp=pw?{vol:vol(A)-vol(pw),pct:pw&&vol(pw)?Math.round((vol(A)-vol(pw))/vol(pw)*100):null}:null;
  delete A.cur;DB.sessions.push(A);DB.active=null;save();summary(A);vib([30,60,30,60,120]);
}
function summary(A){
  const cmp=A.cmp&&A.cmp.pct!=null?`<div class="card"><div class="eyebrow mb8">Сравнение с прошлой «${esc(A.workoutName.charAt(0))}»</div><div class="row between"><span>Объём</span><b class="num ${A.cmp.pct>=0?'cy':'warn'}">${A.cmp.pct>=0?'+':''}${A.cmp.pct}%</b></div></div>`:'';
  $('#woin').innerHTML=`<div class="wo-body" style="padding-top:18px">
  <div><div class="eyebrow">Готово</div><h2 style="font-size:32px;margin-top:6px">Тренировка завершена</h2></div>
  <div class="sum-grid"><div class="card"><div class="num">${fmt(dur(A))}</div><div class="muted small">время</div></div><div class="card"><div class="num">${setsOf(A)}</div><div class="muted small">подходов</div></div><div class="card"><div class="num">${r1(vol(A)/1000)}</div><div class="muted small">объём, т</div></div></div>
  ${A.prs&&A.prs.length?`<div class="card stack"><div class="eyebrow">Новые рекорды</div>${A.prs.map(p=>`<div class="pr"><span class="badge cy">PR</span><div class="grow">${esc(p.name)}</div><b class="num">${esc(p.val)}</b><span class="muted small">было ${esc(p.was)}</span></div>`).join('')}</div>`:''}
  ${cmp}
  <div class="card"><div class="eyebrow mb8">Как самочувствие?</div><div class="row">${['Тяжело','Нормально','Легко'].map(t=>`<button class="btn sec" data-a="feel" data-f="${t}" style="padding:12px;font-size:14px">${t}</button>`).join('')}</div></div>
  <div class="field"><label for="notes">Заметка</label><textarea class="in" id="notes" rows="2" placeholder="Что запомнить на следующий раз" data-in="notes" data-id="${A.id}"></textarea></div>
  </div><div class="cta"><button class="btn" data-a="closeWo">Готово</button></div>`;
}

function exportData(){
  const blob=new Blob([JSON.stringify({app:'forma',v:1,exportedAt:new Date().toISOString(),db:DB,photos:PH})],{type:'application/json'});
  const name='forma-backup-'+dk(new Date())+'.json',file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Резервная копия Forma'}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Копия сохранена');
}
function importObj(o){
  if(o&&o.app==='forma'&&o.db){DB=Object.assign(DEF_DB(),o.db);if(Array.isArray(o.photos)){PH=o.photos;savePh()}load_fix();save();return 'Forma'}
  if(o&&(o.sessions||o.workouts)){ // BODY OS
    const keep=new Set(DB.sessions.map(s=>s.id));
    (o.sessions||[]).forEach(s=>{if(!keep.has(s.id)&&s.status==='done')DB.sessions.push(s)});
    const km=new Set(DB.measurements.map(m=>m.date));(o.measurements||[]).forEach(m=>{if(!km.has(m.date))DB.measurements.push(m)});
    if(o.exercises)Object.keys(o.exercises).forEach(id=>{const e=o.exercises[id];if(!DB.exercises[id])DB.exercises[id]=Object.assign({step:1},e);else DB.exercises[id]=Object.assign({},DB.exercises[id],{sets:e.sets||DB.exercises[id].sets,reps:e.reps||DB.exercises[id].reps,rest:e.rest||DB.exercises[id].rest})});
    if(o.workouts&&o.workouts.length)DB.workouts=o.workouts.map(w=>Object.assign({},w,{name:String(w.name||'').replace(/^Тренировка\s+/,'')}));
    if(o.user){if(o.user.name&&!DB.user.name)DB.user.name=o.user.name;if(o.user.height)DB.user.height=o.user.height;if(o.user.targetWeight)DB.user.targetWeight=o.user.targetWeight}
    if(Array.isArray(o.photos)&&o.photos.length&&!PH.length){PH=o.photos.map(p=>({id:p.id||uid(),date:p.date,src:p.src}));savePh()}
    load_fix();save();return 'BODY OS';
  }
  throw new Error('format');
}
function load_fix(){DB.user=Object.assign(DEF_DB().user,DB.user||{});DEF_EX.forEach(e=>{if(!DB.exercises[e.id])DB.exercises[e.id]=Object.assign({},e)});Object.values(DB.exercises).forEach(e=>{if(e.step==null)e.step=1;if(e.dc==null)e.dc=2});
  DB.sessions.forEach(s=>s.exercises.forEach(x=>{if(!DB.exercises[x.exerciseId])DB.exercises[x.exerciseId]={id:x.exerciseId,name:x.exerciseId,muscle:'',sets:3,reps:10,rest:60,dc:2,measure:'reps',step:1,desc:''}}))}
function applyTheme(){const t=DB.user.theme,r=document.documentElement;if(t==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  const dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name=theme-color]').setAttribute('content',dark?'#060a13':'#edf2fb')}
function photoPick(file){
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    PH.push({id:uid(),date:new Date().toISOString(),src:c.toDataURL('image/jpeg',.72)});if(PH.length>30)PH.shift();if(savePh()){render();toast('Фото добавлено')}else PH.pop()};im.src=rd.result};rd.readAsDataURL(file);
}

  else if(k==='notes'){const s=DB.sessions.find(x=>x.id===t.dataset.id);if(s){s.notes=t.value;save()}}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.in==='pEx'){pEx=t.value;render()}});
$('#fileImport').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);const n=importObj(o);render();toast('Загружено из '+n)}catch(err){toast('Не удалось прочитать файл')}};rd.readAsText(f);e.target.value=''});
$('#filePhoto').addEventListener('change',e=>{const f=e.target.files[0];if(f)photoPick(f);e.target.value=''});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

// ====================== boot ======================
load();load_fix();applyTheme();render();
if(DB.active){if(DB.active.status==='active')openWo();else{DB.active=null;save()}}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
